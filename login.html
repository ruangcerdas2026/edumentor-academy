<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Ruang Cerdas</title>

<link rel="stylesheet" href="style.css">

<style>
.login-box{
max-width:400px;
margin:150px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#2563EB;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="login-box">

<h2>Login Siswa</h2>

<form action="dashboard.html">

<input type="email" placeholder="Email" required>

<input type="password" placeholder="Password" required>

<button type="submit">
Masuk
</button>

</form>

</div>

</body>
</html>
